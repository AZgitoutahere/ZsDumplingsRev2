<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><!-- figma:title --></title>
    <link rel="canonical" href="https://zsdumplings.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://zsdumplings.com/" />
    <meta name="twitter:title" content="Z's Dumplings | Shanghai-Style Dumplings in Ann Arbor" />
    <meta name="twitter:description" content="Handmade Shanghai-style dumplings, sheng jian bao, sides, catering, and food trailer locations in Ann Arbor and Southeast Michigan." />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FoodEstablishment",
        "name": "Z's Dumplings",
        "url": "https://zsdumplings.com/",
        "description": "Handmade Shanghai-style dumplings, sheng jian bao, sides, catering, and food trailer locations in Ann Arbor and Southeast Michigan.",
        "servesCuisine": ["Chinese", "Shanghai-style dumplings"],
        "areaServed": [
          { "@type": "City", "name": "Ann Arbor" },
          { "@type": "AdministrativeArea", "name": "Southeast Michigan" }
        ],
        "sameAs": ["https://www.instagram.com/zs.dumplings/"]
      }
    </script>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->

    <!-- Netlify scans this hidden HTML form during deployment. The visible React form submits to the same form name. -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="purpose" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
